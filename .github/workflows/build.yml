name: Build

on: [push, pull_request]

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-2025
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        run: |
          winget install LLVM --disable-interactivity --accept-source-agreements --accept-package-agreements
          set CC=clang-cl
          set CXX=clang-cl
          set CFLAGS="/clang:-flto=thin /clang:-O3 /clang:-fuse-ld=lld-link /clang:march=x86-64-v3"
          set CXXFLAGS="/clang:-flto=thin /clang:-O3 /clang:-fuse-ld=lld-link /clang:march=x86-64-v3"
          set AR=llvm-lib

          rustup toolchain install nightly
          rustup override set nightly
          rustup component add rust-src

          set RUSTFLAGS="-Ctarget-cpu=x86-64-v3 -Ctarget-feature=+crt-static -Clinker-plugin-lto -Zthreads=8"
          cargo build --release "-Zbuild-std=std,core,alloc,panic_abort" --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v6
        with:
          name: ReAET-windows
          path: target/x86_64-pc-windows-msvc/release/ReAET.exe

  build-macos:
    name: Build MacOS
    runs-on: macos-15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        run: |
          brew update
          brew install nasm llvm@20 lld@20
          export CC="$(brew --prefix llvm@20)/bin/clang"
          export CXX="$(brew --prefix llvm@20)/bin/clang++"
          export AR="$(brew --prefix llvm@20)/bin/llvm-ar"
          export CFLAGS="-flto=thin -O3"
          export CXXFLAGS="-flto=thin -O3"

          rustup toolchain install nightly-2025-08-01
          rustup override set nightly-2025-08-01
          rustup component add rust-src

          export RUSTFLAGS="-Ctarget-feature=+crt-static -Clinker-plugin-lto -Clinker=$PWD/macos-linker.sh -Clink-arg=-fuse-ld=$(brew --prefix lld@20)/bin/ld64.lld -Zthreads=8"
          cargo build --release -Zbuild-std=std,core,alloc,panic_abort --target aarch64-apple-darwin

      - uses: actions/upload-artifact@v6
        with:
          name: ReAET-macos-aarch64
          path: target/aarch64-apple-darwin/release/ReAET

  build-intel-macos:
    name: Build MacOS (Intel)
    runs-on: macos-15-intel
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        run: |
          brew update
          brew install nasm llvm@20 lld@20
          export CC="$(brew --prefix llvm@20)/bin/clang"
          export CXX="$(brew --prefix llvm@20)/bin/clang++"
          export AR="$(brew --prefix llvm@20)/bin/llvm-ar"
          export CFLAGS="-flto=thin -O3 -march=x86-64-v3"
          export CXXFLAGS="-flto=thin -O3 -march=x86-64-v3"

          rustup toolchain install nightly-2025-08-01
          rustup override set nightly-2025-08-01
          rustup component add rust-src

          export RUSTFLAGS="-Ctarget-cpu=x86-64-v3 -Ctarget-feature=+crt-static -Clinker-plugin-lto -Clinker=$PWD/macos-linker.sh -Clink-arg=-fuse-ld=$(brew --prefix lld@20)/bin/ld64.lld -Zthreads=8"
          cargo build --release -Zbuild-std=std,core,alloc,panic_abort --target x86_64-apple-darwin

      - uses: actions/upload-artifact@v6
        with:
          name: ReAET-macos-x86_64
          path: target/x86_64-apple-darwin/release/ReAET

  build-linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          export CFLAGS="-flto=thin -O3 -march=x86-64-v3"
          export CXXFLAGS="-flto=thin -O3 -march=x86-64-v3"

          sudo apt-get update
          sudo apt-get install libglib2.0-dev libatk1.0-dev libgtk-3-dev nasm clang-21 lld-21

          rustup toolchain install nightly
          rustup override set nightly
          rustup component add rust-src

          export RUSTFLAGS="-Ctarget-cpu=x86-64-v3 -Clinker-plugin-lto -Clinker=clang-21 -Clink-arg=-fuse-ld=lld -Zthreads=8"
          cargo build --release -Zbuild-std=std,core,alloc,panic_abort --target x86_64-unknown-linux-gnu

      - uses: actions/upload-artifact@v6
        with:
          name: ReAET-linux
          path: target/x86_64-unknown-linux-gnu/release/ReAET
